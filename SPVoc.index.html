<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speakout B2 Vocabulary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9fb;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .dashboard-container {
            width: 100%;
            max-width: 600px;
        }
        .unit-container {
            margin-bottom: 25px;
        }
        .unit-title {
            font-size: 14px;
            font-weight: bold;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .lesson-card {
            padding: 20px 0;
            text-align: center;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        /* Active lessons (Blue/Purple style from your image) */
        .lesson-card.active {
            border: 2px solid #5d5fef;
            color: #5d5fef;
            background-color: #fff;
        }
        .lesson-card.active:hover {
            background-color: #f0f1ff;
        }
        /* Locked lessons (Greyed out style from your image) */
        .lesson-card.locked {
            background-color: #f3f3f6;
            color: #d1d1d6;
            border: 2px solid transparent;
            pointer-events: none; /* Disables clicking */
        }
    </style>
</head>
<body>

    <h1>Speakout B2</h1>

    <div class="dashboard-container">

        <!-- UNIT 1 -->
        <div class="unit-container">
            <div class="unit-title">Unit 1</div>
            <div class="lesson-grid">
                <a href="unit-1/1A/" class="lesson-card active">1A</a>
                <a href="unit-1/1B/" class="lesson-card active">1B</a>
                <a href="unit-1/1C/" class="lesson-card active">1C</a>
                <a href="unit-1/1D/" class="lesson-card locked">1D</a>
            </div>
        </div>

        <!-- UNIT 2 -->
        <div class="unit-container">
            <div class="unit-title">Unit 2</div>
            <div class="lesson-grid">
                <a href="unit-2/2A/" class="lesson-card locked">2A</a>
                <a href="unit-2/2B/" class="lesson-card locked">2B</a>
                <a href="unit-2/2C/" class="lesson-card locked">2C</a>
                <a href="unit-2/2D/" class="lesson-card locked">2D</a>
            </div>
        </div>

        <!-- UNIT 3 -->
        <div class="unit-container">
            <div class="unit-title">Unit 3</div>
            <div class="lesson-grid">
                <a href="unit-3/3A/" class="lesson-card locked">3A</a>
                <a href="unit-3/3B/" class="lesson-card locked">3B</a>
                <a href="unit-3/3C/" class="lesson-card locked">3C</a>
                <a href="unit-3/3D/" class="lesson-card locked">3D</a>
            </div>
        </div>

        <!-- UNIT 4 -->
        <div class="unit-container">
            <div class="unit-title">Unit 4</div>
            <div class="lesson-grid">
                <a href="unit-4/4A/" class="lesson-card locked">4A</a>
                <a href="unit-4/4B/" class="lesson-card locked">4B</a>
                <a href="unit-4/4C/" class="lesson-card locked">4C</a>
                <a href="unit-4/4D/" class="lesson-card locked">4D</a>
            </div>
        </div>

        <!-- UNIT 5 -->
        <div class="unit-container">
            <div class="unit-title">Unit 5</div>
            <div class="lesson-grid">
                <a href="unit-5/5A/" class="lesson-card locked">5A</a>
                <a href="unit-5/5B/" class="lesson-card locked">5B</a>
                <a href="unit-5/5C/" class="lesson-card locked">5C</a>
                <a href="unit-5/5D/" class="lesson-card locked">5D</a>
            </div>
        </div>

        <!-- UNIT 6 -->
        <div class="unit-container">
            <div class="unit-title">Unit 6</div>
            <div class="lesson-grid">
                <a href="unit-6/6A/" class="lesson-card locked">6A</a>
                <a href="unit-6/6B/" class="lesson-card locked">6B</a>
                <a href="unit-6/6C/" class="lesson-card locked">6C</a>
                <a href="unit-6/6D/" class="lesson-card locked">6D</a>
            </div>
        </div>

        <!-- UNIT 7 -->
        <div class="unit-container">
            <div class="unit-title">Unit 7</div>
            <div class="lesson-grid">
                <a href="unit-7/7A/" class="lesson-card locked">7A</a>
                <a href="unit-7/7B/" class="lesson-card locked">7B</a>
                <a href="unit-7/7C/" class="lesson-card locked">7C</a>
                <a href="unit-7/7D/" class="lesson-card locked">7D</a>
            </div>
        </div>

        <!-- UNIT 8 -->
        <div class="unit-container">
            <div class="unit-title">Unit 8</div>
            <div class="lesson-grid">
                <a href="unit-8/8A/" class="lesson-card locked">8A</a>
                <a href="unit-8/8B/" class="lesson-card locked">8B</a>
                <a href="unit-8/8C/" class="lesson-card locked">8C</a>
                <a href="unit-8/8D/" class="lesson-card locked">8D</a>
            </div>
        </div>

    </div>

</body>
</html>
